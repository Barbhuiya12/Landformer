  # # Input variables - Dynamic configurationLloss
  variables:
    forcing: ['prcp', 'tasmax', 'tasmin', 'vp', 'swdown', 'lwdown', 'sp','wind']
    parameters: ['infilt', 'Dsmax', 'Ds', 'Ws', 'd1', 'd2', 'd3', 
                 'Ksat1', 'Ksat2', 'Ksat3', 'expt1', 'expt2', 'expt3']
    #target: ['evap', 'runoff', 'soil_moisture']  # Dynamic target variables (no baseflow)
    target: ['evap','soil_moisture_total','Q']
  
  paths:
    forcing: 'data/Surr_forcing/forcing.zarr'
    parameters: 'data/Surr_forcing/pram_150.nc'
    # Multi-file target support - paths for individual variable files
    target_files:
      evap: 'data/Surr_obs/evap.zarr'
      soil_moisture_total: 'data/Surr_obs/SM.zarr'  
      Q: 'data/Surr_obs/Q_real.zarr'

  # Data processing options (optional)
  # This section is available for future data transforms and caching strategies
  processing:
    normalization: 'zscore'  # 'zscore' | 'minmax' (informational; actual logic may live in dataset)
    cache: false              # If supported by dataset pipeline, cache processed arrays
    cache_size_limit: 5 # Maximum number of items in the data cache

# Training Configuration
training:
  grid_balanced_sampling: true  # Enable balanced sampling across grids
  spatial_regularization:
    enabled: true
    weight: 0.2  # Weight for spatial smoothness loss
    distance_threshold: 1.0  # Degrees for neighbor definition
  # Start from pretrained model (uniform soup of 25 models)
  pretrained_model_path: null

  # ====== FINE-TUNE HEAD OPTION ======
  # Options: 'none' (default), 'SM', 'Q', 'ET', 'evap', 'sm', 'q', 'et'
  finetune_head: 'none'            # <-- CHANGE THIS TO TEST DIFFERENT HEADS
  # 'SM'   = Fine-tune only SM head, freeze Q and ET
  # 'Q'    = Fine-tune only Q head, freeze SM and ET
  # 'ET'   = Fine-tune only ET head, freeze SM and Q
  # 'evap' = Fine-tune only evap head, freeze sm and Q
  # 'none' = Train all heads normally (default)
  # ===================================
  
  # Resume training options
  resume_training: false
  restart_path: null
  
  learning_rate: 0.0001  
  epochs: 200

  # Core training hyperparameters
  batch_size: 3000              # Train loader batch size1
  batch_size_valid: 700        # Validation/Test loader batch size (defaults to 256 if omitted)

  patience: 10                 # Early stopping patience (epochs without val improvement)
  epoch_save: 1               # Save checkpoint every N epochs

  # Primary loss function used for optimization
  # Options: 'MSE', 'NSE', 'KGE'
  # loss_function: MSE
  # loss_function: BIAS_CORRECTED_MSE
  # loss_kwargs:
  #   bias_weight: 1.0  # Add explicit bias penalty

  loss_function: KGE
  loss_kwargs:
    bias_weight: 4.0  # Penalize bias 2x more
    var_weight: 2   # Penalize variance errors 1.5x more
    corr_weight: 1.0
    
  # Multi-output specific settings - dynamic based on target variables
  multi_output:
    enabled: true
    loss_weights: [1.0, 1.0, 1.0]  # Weights correspond to order in data.variables.target
    individual_metrics: true       # Track per-output metrics (displayed in logs)
    aggregate_metrics: true        # Track aggregated metrics across outputs
  
  # Learning rate scheduler
  scheduler:
    enabled: true  # Enable learning rate scheduling
    type: cosine
    factor: 0.5                  # Halve LR when stuck
    patience: 5                  # Wait 5 epochs
    min_lr: 0.000001 # Minimum learning rate

  # Memory optimization
  memory:
    num_workers: 16  # Conservative to minimize RAM and worker overhead
    pin_memory: true
    persistent_workers: false
    non_blocking: true  # Used for .to(device, non_blocking=True), NOT DataLoader
    prefetch_factor: 4  # Conservative prefetch to reduce memory
    drop_last: true
    timeout: 0
    
  # Data processing optimizations  
  optimizations:
    optimal_chunking: false
    limit_data_loading: false
    cache_normalization: true
    memory_efficient_training: true
    gradient_clipping: 1.0  # Clip gradients for stability
    use_amp: true  # Automatic mixed precision for speed
    dask_enabled: true
    dask_num_workers: 30
    dask_threads_per_worker: 1
    dask_memory_limit: '100GB'

# Output Configuration
output:
  base_dir: 'data_ext/extended_results'
  experiment_name: 'lstm_benchmark'
  save_predictions: true
  save_metrics: true
  create_plots: true

# Hardware Configuration
hardware:
  device: 'cuda:0' # 'auto', 'cpu', 'cuda', 'cuda:0', etc.
  compile_model: false  # PyTorch 2.0 model compilation

# Logging Configuration
logging:
  level: 'INFO'
  log_file: 'training.log'
  tensorboard: true
  log_interval: 1  # Log every N batches
  diagnostics_interval: 1  # Generate best/worst grid plots every N epochs (1 = every epoch)

# # Cross-validation and Testing
evaluation:
  cross_validation:
    enabled: true
    folds: 5
# Not implemented k fold its just for test
  
  # Test on different grid samples
  grid_generalization:
    enabled: true
    test_on_different_grids: true
    grid_split_seed: 42