# Unified Surrogate Model Configuration
# Author: Siddik
# Description: Centralized configuration for VIC surrogate model training and testing
model:
  model_type: 'lstm'
  # Swin Transformer specific parameters
  embed_dim: 128                   # Reduced from 128
  patch_size: 10
  depths: [4, 4, 16, 4]           # Reduced from [2, 2, 8, 2]
  num_heads: [4, 8, 16, 18] 
  window_size: 14                # Increased context
  dropout: 0.1                    # Increased from 0.1
  drop_path_rate: 0.15            # Increased from 0.15
  
  # Focal Loss for extreme events (floods/droughts) - Author: Siddik
  focal_loss:
    enabled: false                 # Enable focal weighting
    gamma: 2.0                    # Focus on hard samples (0=standard MSE, 2=recommended)
  
  
  sequence_length: 270
  
  # LSTM fallback parameters (not used by Swin)
  hidden_size: 128  # For other model types
  num_layers: 2     # For other model types
  # Input dimensions (will be calculated automatically)
  input_dims:
    n_forcing: 7        # prcp, tmax, tmin, vp, swdown, lwdown, sp
    n_params: 13        # VIC parameters
    n_lag_features: 0   # Lag features (if enabled)
  
  # Flexible Lag Configuration System
  # OPTIONAL: You can completely disable lags by setting enable_lags: false
  enable_lags: false
  
  # Legacy support: simple lag values for target variables only (DEPRECATED)
  # lags: [1]  # Use lag_config instead
  
  # NEW: Advanced lag configuration - specify lags for any variable type
  lag_config:
    # Lag configuration for forcing variables (meteorological inputs)
    forcing: {}
      #prcp: [1, 2, 3,4,7,30,180]      # Use 1, 2, and 3-day precipitation lags
      # tmax: [1]            # Use 1-day temperature lag
      # tmin: [1]            # Use 1-day minimum temperature lag
      # vp: []             # No lags for vapor pressure (commented out)
      # swdown: [1]        # Uncomment to add solar radiation lag
      # lwdown: []         # No lags for longwave radiation
      # sp: []             # No lags for surface pressure
    
    # Lag configuration for parameter variables (soil/vegetation)
    parameters: {}
      # Usually parameters don't need lags since they're static
      # But you can add them if needed for specific experiments
      # infilt: [1]        # Uncomment if you want parameter lags
    
    # Lag configuration for target variables (model outputs)
    target: {}
      # evap: [1]            # Use 1-day evaporation lag
      # sm: [1, 2]           # Use 1 and 2-day soil moisture lags
      # Q: [1]               # Use 1-day runoff lag
  
  # Spatial Attention Configuration (NEW)
  # Enables graph attention between spatially neighboring grids
  spatial_attention:
    enabled: true                 # Enable/disable spatial attention
    max_distance: 2.0             # Max distance (degrees) to connect neighbors
    num_heads: 8                  # Number of attention heads in GAT
    dropout: 0.1                  # Dropout for spatial attention layer
    use_residual: true            # Use residual connections
  
  # Task-Specific Prediction Heads (NEW)
  # Configures MLP architecture for each hydrological variable
  task_heads:
    evap:
      hidden_dims: [512]
      activation: 'gelu'
      dropout: 0.2
      output_activation: null  # ET >= 0
    
    soil_moisture_total:
      hidden_dims: [512]
      activation: 'gelu'
      dropout: 0.2
      output_activation: sigmoid   # SM in [0, 1]
    
    Q:
      hidden_dims: [512,128]
      activation: 'gelu'
      dropout: 0.2
      output_activation: null  # Q >= 0

# Data Configuration
data:
  # Spatial domain
  spatial:
    lat_min: 5
    lat_max: 40
    lon_min: 65
    lon_max: 100
    # step: null  # Spatial sampling step (null for no subsampling)

    # lat_min: 23
    # lat_max: 26
    # lon_min: 74
    # lon_max: 75
    step: null  # Spatial sampling step (null for no subsampling)
  # Temporal ranges
  temporal:
    train_range: ['1995-01-01', '1998-12-31']
    valid_range: ['1996-01-01', '2000-12-31']
    test_range: ['2001-01-01', '2006-12-31']
  
  # File indices for different datasets
  file_indices:
    train_files: [70, 100] # Full training file range (101 files)
    valid_files: [102, 103]  # Validation file range
    test_files: [106, 106]     # Test file range
  
  # Grid sampling - Full control by Siddik
  grid_sampling:
    # Option 1: Use exact numbers (preferred)
    use_exact_counts: true
    train_grids:  2000   # Exact number of grids for training (sparse)
    validation_grids: 70 #Exact number of grids for validation (sparse)
    test_grids: 70       # Exact number of grids for testing (sparse)
    
    # Option 2: Use percentages (legacy, used only if use_exact_counts is false)
    train_percentage: 0.80   # 50% of valid grids for training (sparse)
    validation_percentage: 0.10  # 30% of valid grids for validation (sparse)
    test_percentage: 0.10    # 20% of valid grids for testing (sparse)
    
    # Grid selection strategy
    selection_strategy: 'random'  # Options: 'random', 'stratified', 'spatial'
    ensure_no_overlap: true       # Ensure train/val/test grids don't overlap
    
    # Stratification options (used if selection_strategy is 'stratified')
    stratify_by: 'elev'          # Variable to stratify by
    n_strata: 5                  # Number of strata to create
    # NEW FEATURE: Grid exclusion - Skip previously used grids from earlier runs
