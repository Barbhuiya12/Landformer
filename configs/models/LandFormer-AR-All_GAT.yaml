# LandFormer-AR-All with the spatial graph attention module (Section 4.7).
# Identical to LandFormer-AR-All.yaml except for model.spatial_attention and the experiment name.
# To train on the same cells as LandFormer-AR-All, copy grid_locations_train.pkl and
# grid_locations_valid.pkl from results/Large_full_lag/ to results/Large_full_lag_GAT/ before training.
model:
  model_type: multi_task_swin
  dropout: 0.1
  sequence_length: 270
  hidden_size: 128
  num_layers: 2
  enable_lags: true
  lag_config:
    forcing: {}
    parameters: {}
    target:
      evap: [1]
      sm: [1]
      Q: [1]
  lags: null
  multi_task: null
  embed_dim: 128
  depths: [4, 4, 16, 4]
  num_heads: [4, 8, 16, 18]
  window_size: 14
  patch_size: 10
  drop_path_rate: 0.15
  hidden_channels: [64, 128, 128, 64]
  kernel_size: 3
  focal_loss: {enabled: false, gamma: 2.0}
  spatial_attention: {enabled: true, max_distance: 2.0, num_heads: 8, dropout: 0.1, cells_per_group: 10}
  use_hierarchical: true
data:
  spatial: {lat_min: 6, lat_max: 38, lon_min: 68, lon_max: 98, step: null}
  temporal:
    train_range: ['1990-01-01', '1995-12-31']
    valid_range: ['1996-01-01', '2000-12-31']
    test_range: ['2001-01-01', '2006-12-31']
  file_indices:
    train_files: [1, 10]
    valid_files: [101, 101]
    test_files: [106, 106]
  grid_sampling: {use_exact_counts: true, train_grids: 1000, validation_grids: 70,
    test_grids: 70, train_percentage: 0.8, validation_percentage: 0.1, test_percentage: 0.1,
    selection_strategy: random, ensure_no_overlap: true, stratify_by: elev, n_strata: 5}
  variables:
    forcing: [prcp, tasmax, tasmin, vp, swdown, lwdown, sp, wind]
    parameters: [infilt, Dsmax, Ds, Ws, d1, d2, d3, Ksat1, Ksat2, Ksat3, expt1, expt2,
      expt3]
    target: [evap, soil_moisture_total, Q]
  paths:
    forcing: data/Surr_forcing/forcing.zarr
    parameters: data/Surr_forcing/pram_150.nc
    target_files: {evap: data/Surr_obs/evap.zarr,
      soil_moisture_total: data/Surr_obs/SM.zarr,
      Q: data/Surr_obs/Q_real.zarr}
  processing: {normalization: zscore, cache: false, cache_size_limit: 5}
  cache_size_limit: 5
training:
  epochs: 200
  batch_size: 3000
  learning_rate: 0.001
  loss_function: KGE
  memory: {num_workers: 8, pin_memory: true, persistent_workers: false, non_blocking: true,
    prefetch_factor: 4, drop_last: true, timeout: 0}
  batch_size_valid: 700
  patience: 10
  epoch_save: 1
  optimizations: {optimal_chunking: false, limit_data_loading: false, cache_normalization: true,
    memory_efficient_training: true, gradient_clipping: 1.0, use_amp: true, dask_enabled: true,
    dask_num_workers: 30, dask_threads_per_worker: 1, dask_memory_limit: 100GB}
  multi_output:
    enabled: true
    loss_weights: [1.0, 1.0, 1.0]
    individual_metrics: true
    aggregate_metrics: true
  physical_constraints: null
  scheduler: {enabled: true, type: cosine, factor: 0.5, patience: 5, min_lr: 1.0e-06}
  multi_task: null
  finetune_head: none
  pretrained_model_path: null
  resume_training: false
  restart_path: null
output: {base_dir: results,
  experiment_name: Large_full_lag_GAT, save_predictions: true, save_metrics: true,
  create_plots: true, multi_task: null}
hardware: {device: 'cuda:1', compile_model: false}
logging: {level: INFO, log_file: training.log, tensorboard: true, log_interval: 1,
  diagnostics_interval: 1}
evaluation:
  cross_validation: {enabled: true, folds: 5}
  grid_generalization: {enabled: true, test_on_different_grids: true, grid_split_seed: 42}
